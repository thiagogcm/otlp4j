name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up just
        uses: extractions/setup-just@v4
        with:
          just-version: 1.53.0

      - name: Run CI recipe
        run: just ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-aggregate
          path: otlp4j-coverage/target/site/jacoco-aggregate
          if-no-files-found: warn
